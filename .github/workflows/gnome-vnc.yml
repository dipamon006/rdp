name: XFCE Desktop + Tailscale + VNC

on:
  workflow_dispatch:

jobs:
  xfce-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Remove snap completely
        shell: bash
        run: |
          sudo systemctl stop snapd 2>/dev/null || true
          sudo systemctl disable snapd 2>/dev/null || true
          sudo apt-get purge -y snapd 2>/dev/null || true
          sudo rm -rf /snap /var/snap /var/lib/snapd /root/snap
          printf 'Package: snapd\nPin: release a=*\nPin-Priority: -10\n' | \
            sudo tee /etc/apt/preferences.d/no-snap > /dev/null

      - name: Install XFCE + VNC + Chromium (no snap)
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 xfce4-goodies xfce4-terminal \
            tigervnc-standalone-server tigervnc-tools \
            dbus-x11 x11-xserver-utils \
            curl wget git unzip net-tools htop \
            mousepad ristretto xarchiver thunar vlc
          sudo add-apt-repository -y ppa:xtradeb/apps
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y chromium

      - name: Create User
        shell: bash
        run: |
          sudo useradd -m -s /bin/bash -U rdpuser || true
          sudo usermod -p "$(openssl passwd -6 1234)" rdpuser
          sudo usermod -aG sudo rdpuser
          echo "rdpuser ALL=(ALL) NOPASSWD:ALL" | \
            sudo tee /etc/sudoers.d/rdpuser-nopasswd
          sudo mkdir -p /home/rdpuser/.vnc
          sudo chown -R rdpuser:rdpuser /home/rdpuser

      - name: Install Tailscale
        shell: bash
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Connect Tailscale
        shell: bash
        run: |
          sudo tailscale up \
            --auth-key="${{ secrets.TAILSCALE_AUTHKEY }}" \
            --hostname="xfce-${GITHUB_RUN_ID}"
          for i in {1..30}; do
            TS_IP=$(tailscale ip -4 2>/dev/null | head -n1)
            [ -n "$TS_IP" ] && break
            sleep 3
          done
          [ -z "$TS_IP" ] && echo "Tailscale failed" && exit 1
          echo "TAILSCALE_IP=$TS_IP" >> "$GITHUB_ENV"
          echo "Tailscale IP: $TS_IP"

      - name: Configure VNC
        shell: bash
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          sudo -u rdpuser mkdir -p /home/rdpuser/.vnc
          printf '%s\n%s\nn\n' "$VNC_PASSWORD" "$VNC_PASSWORD" | \
            sudo -u rdpuser tigervncpasswd /home/rdpuser/.vnc/passwd
          sudo chmod 600 /home/rdpuser/.vnc/passwd
          printf '#!/bin/bash\nunset SESSION_MANAGER\nunset DBUS_SESSION_BUS_ADDRESS\nexport XDG_SESSION_TYPE=x11\nexport XDG_CURRENT_DESKTOP=XFCE\nexec startxfce4\n' | \
            sudo tee /home/rdpuser/.vnc/xstartup > /dev/null
          sudo chmod +x /home/rdpuser/.vnc/xstartup
          sudo chown -R rdpuser:rdpuser /home/rdpuser/.vnc

      - name: Start VNC Server
        shell: bash
        run: |
          sudo -u rdpuser tigervncserver :1 \
            -localhost no \
            -geometry 1600x900 \
            -depth 24 \
            -SecurityTypes VncAuth \
            -rfbauth /home/rdpuser/.vnc/passwd
          sleep 10
          echo "VNC started on :1 (port 5901)"

      - name: Verify VNC Port
        shell: bash
        run: |
          if ! timeout 10 bash -c "</dev/tcp/$TAILSCALE_IP/5901"; then
            echo "VNC not reachable — log:"
            cat /home/rdpuser/.vnc/*.log || true
            exit 1
          fi
          echo "VNC reachable at $TAILSCALE_IP:5901"

      - name: Print Connection Info
        shell: bash
        run: |
          echo "========================================"
          echo "  XFCE DESKTOP READY"
          echo "  VNC IP   : $TAILSCALE_IP"
          echo "  VNC Port : 5901"
          echo "  User     : rdpuser"
          echo "  Pass     : 1234"
          echo "========================================"

      - name: Keep Alive
        shell: bash
        run: |
          while true; do
            echo "[$(date '+%H:%M:%S')] Running — $(uptime -p)"
            sleep 300
          done
