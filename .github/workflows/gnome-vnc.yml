name: XFCE Desktop + Tailscale + VNC

on:
  workflow_dispatch:

jobs:
  xfce-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Install XFCE + VNC + Browser (no snap)
        shell: bash
        run: |
          sudo apt-get update -qq

          # Remove snap entirely
          sudo systemctl stop snapd || true
          sudo apt-get purge -y snapd || true
          sudo rm -rf /snap /var/snap /var/lib/snapd

          # Prevent snap from coming back
          sudo tee /etc/apt/preferences.d/no-snap <<'PREF'
          Package: snapd
          Pin: release a=*
          Pin-Priority: -10
          PREF

          # XFCE desktop + VNC
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            xfce4-terminal \
            tigervnc-standalone-server \
            tigervnc-tools \
            dbus-x11 \
            x11-xserver-utils \
            curl wget git unzip net-tools htop

          # Firefox (deb, not snap)
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://packages.mozilla.org/apt/repo-signing-key.gpg | \
            sudo tee /etc/apt/keyrings/packages.mozilla.org.asc > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/packages.mozilla.org.asc] \
            https://packages.mozilla.org/apt mozilla main" | \
            sudo tee /etc/apt/sources.list.d/mozilla.list
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y firefox

          # Extras
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            mousepad \
            ristretto \
            xarchiver \
            thunar \
            vlc \
            gedit

      - name: Create User
        shell: bash
        run: |
          sudo useradd -m -s /bin/bash -U rdpuser || true
          sudo usermod -p "$(openssl passwd -6 1234)" rdpuser
          sudo usermod -aG sudo rdpuser
          echo "rdpuser ALL=(ALL) NOPASSWD:ALL" | \
            sudo tee /etc/sudoers.d/rdpuser-nopasswd
          sudo mkdir -p /home/rdpuser/.vnc
          sudo chown -R rdpuser:rdpuser /home/rdpuser

      - name: Install Tailscale
        shell: bash
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Connect Tailscale
        shell: bash
        run: |
          sudo tailscale up \
            --auth-key="${{ secrets.TAILSCALE_AUTHKEY }}" \
            --hostname="xfce-${GITHUB_RUN_ID}"

          for i in {1..30}; do
            TS_IP=$(tailscale ip -4 2>/dev/null | head -n1)
            [ -n "$TS_IP" ] && break
            sleep 3
          done

          [ -z "$TS_IP" ] && echo "Tailscale failed" && exit 1
          echo "TAILSCALE_IP=$TS_IP" >> "$GITHUB_ENV"
          echo "Tailscale IP: $TS_IP"

      - name: Configure VNC
        shell: bash
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          sudo -u rdpuser mkdir -p /home/rdpuser/.vnc

          printf '%s\n%s\nn\n' "$VNC_PASSWORD" "$VNC_PASSWORD" | \
            sudo -u rdpuser tigervncpasswd /home/rdpuser/.vnc/passwd
          sudo chmod 600 /home/rdpuser/.vnc/passwd

          sudo tee /home/rdpuser/.vnc/xstartup > /dev/null <<'XSTART'
          #!/bin/bash
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          export XDG_SESSION_TYPE=x11
          export XDG_CURRENT_DESKTOP=XFCE
          exec startxfce4
          XSTART

          sudo chmod +x /home/rdpuser/.vnc/xstartup
          sudo chown -R rdpuser:rdpuser /home/rdpuser/.vnc

      - name: Start VNC Server
        shell: bash
        run: |
          sudo -u rdpuser tigervncserver :1 \
            -localhost no \
            -geometry 1600x900 \
            -depth 24 \
            -SecurityTypes VncAuth \
            -rfbauth /home/rdpuser/.vnc/passwd

          sleep 10
          echo "VNC started on :1 (port 5901)"

      - name: Verify VNC Port
        shell: bash
        run: |
          if ! timeout 10 bash -c \
            "</dev/tcp/$TAILSCALE_IP/5901"; then
            echo "VNC not reachable — log:"
            cat /home/rdpuser/.vnc/*.log || true
            exit 1
          fi
          echo "VNC reachable at $TAILSCALE_IP:5901"

      - name: Print Connection Info
        shell: bash
        run: |
          echo "========================================"
          echo "  XFCE DESKTOP READY"
          echo "  VNC IP   : $TAILSCALE_IP"
          echo "  VNC Port : 5901"
          echo "  User     : rdpuser"
          echo "  Pass     : 1234"
          echo "========================================"

      - name: Keep Alive
        shell: bash
        run: |
          while true; do
            echo "[$(date '+%H:%M:%S')] Running — $(uptime -p)"
            sleep 300
          done
